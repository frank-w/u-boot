# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches:
    - '*-bpi'
    - '*-ci'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    env:
      UBOOT_BRANCH: ${{ github.head_ref || github.ref_name }}
      ATF_BRANCH: mtk-atf-2026

    strategy:
      fail-fast: false
      matrix:
        include:
          - board: bpi-r2
            boots: [sdmmc]
            atf: false
            ram8g: false

          - board: bpi-r64
            boots: [sdmmc, emmc]
            atf: true
            ram8g: false

          - board: bpi-r2pro
            boots: [sdmmc]
            atf: false
            ram8g: false

          - board: bpi-r3
            boots: [sdmmc, emmc, spi-nand, spi-nor, ram]
            atf: true
            ram8g: false

          - board: bpi-r3mini
            boots: [emmc, spi-nand, ram]
            atf: true
            ram8g: false

          - board: bpi-r4
            boots: [sdmmc, emmc, spi-nand, ram]
            atf: true
            ram8g: true

          - board: bpi-r4lite
            boots: [sdmmc, emmc, spi-nand, ram]
            atf: true
            ram8g: false

          - board: bpi-r4pro
            boots: [sdmmc, emmc, spi-nand, ram]
            atf: true
            ram8g: true

    steps:
      - uses: actions/checkout@v4

      # ccache restore
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.board }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ matrix.board }}-
            ccache-

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache libssl-dev u-boot-tools \
            gcc-arm-linux-gnueabihf \
            gcc-aarch64-linux-gnu \
            make python3-pyelftools ccache

      - name: Fetch mtk-atf branch
        if: matrix.atf == true
        run: |
          git fetch origin $ATF_BRANCH --depth=1

      - name: Init build helpers
        shell: bash
        run: |
          cat > build_helpers.sh <<'EOF'
          build_boot() {
            BOOT="$1"
            set -euo pipefail

            echo "===================================="
            echo "Building ${BOARD} for ${BOOT}"
            echo "===================================="

            git checkout $UBOOT_BRANCH

            echo -e "board=${BOARD}\ndevice=${BOOT}\n" > build.conf
            cat build.conf

            echo "::group::u-boot"
            bash build.sh importconfig
            bash build.sh build
            bash build.sh rename
            echo "::endgroup::"

            # ATF builds (optional)
            if [ "${ATF}" = "true" ]; then
              git checkout build.conf
              echo "::group::atf"
              echo "---- ATF build for ${BOOT} ----"

              git checkout $ATF_BRANCH

              echo -e "board=${BOARD}\ndevice=${BOOT}" > build.conf

              # normal ATF build
              bash build.sh build
              bash build.sh rename
              echo "::endgroup::"

              if [[ "${BOOT}" == *"mmc"* ]]; then
                echo "::group::baseimage"
                bash build.sh createimg non-interactive
                echo "::endgroup::"
              fi

              echo "::group::atf extended"
              if [ "${RAM8G}" == "true" ]; then
                echo "---- 8G RAM build ----"
                echo "extraflags=DDR4_4BG_MODE=1" >> build.conf
                bash build.sh clean
                bash build.sh build
                bash build.sh rename
              fi

              # optional special NAND/UBI case
              if [[ "${BOOT}" =~ nand|nor ]]; then
                echo "---- UBI build ----"
                echo "extraflags=UBI=1" >> build.conf
                bash build.sh clean
                bash build.sh build
                bash build.sh rename

                if [ "${RAM8G}" == "true" ]; then
                  echo "---- 8G RAM + UBI build ----"
                  echo 'extraflags="UBI=1 DDR4_4BG_MODE=1"' >> build.conf
                  bash build.sh clean
                  bash build.sh build
                  bash build.sh rename
                fi
              fi
              echo "::endgroup::"
              git checkout build.conf
            else
              echo "::group::baseimage-no-atf"
              bash build.sh createimg non-interactive
              echo "::endgroup::"
              git checkout build.conf
            fi
            # we do not need u-boot.bin for all devices
            # only one sdmmc and emmc version (chain loading)
            if [[ ! "${BOOT}" =~ mmc ]]; then
              echo "cleanup non-mmc u-boot.bin"
              rm u-boot*${BOOT}.bin
            fi
            ls -lh *.bin *.img*
          }
          EOF

      - name: Build sdmmc
        if: contains(matrix.boots, 'sdmmc')
        shell: bash
        run: |
          source build_helpers.sh
          build_boot sdmmc
        env:
          BOARD: ${{ matrix.board }}
          ATF: ${{ matrix.atf }}
          RAM8G: ${{ matrix.ram8g }}

      - name: Build emmc
        if: contains(matrix.boots, 'emmc')
        shell: bash
        run: |
          source build_helpers.sh
          build_boot emmc
        env:
          BOARD: ${{ matrix.board }}
          ATF: ${{ matrix.atf }}
          RAM8G: ${{ matrix.ram8g }}

      - name: Build spi-nand
        if: contains(matrix.boots, 'spi-nand')
        shell: bash
        run: |
          source build_helpers.sh
          build_boot spi-nand
        env:
          BOARD: ${{ matrix.board }}
          ATF: ${{ matrix.atf }}
          RAM8G: ${{ matrix.ram8g }}

      - name: Build spi-nor
        if: contains(matrix.boots, 'spi-nor')
        shell: bash
        run: |
          source build_helpers.sh
          build_boot spi-nor
        env:
          BOARD: ${{ matrix.board }}
          ATF: ${{ matrix.atf }}
          RAM8G: ${{ matrix.ram8g }}

      - name: Build ram
        if: contains(matrix.boots, 'ram')
        shell: bash
        run: |
          source build_helpers.sh
          build_boot ram
        env:
          BOARD: ${{ matrix.board }}
          ATF: ${{ matrix.atf }}
          RAM8G: ${{ matrix.ram8g }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uboot-${{ matrix.board }}
          path: |
            ${{ matrix.board }}*_fip.bin
            u-boot-${{ matrix.board }}_*.bin
            ${{ matrix.board }}*_bl2.img
            ${{ matrix.board }}_*.img.gz

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout (longer history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup env
        run: |
          echo "DT=$(date +'%Y-%m-%d_%H%M')" >> $GITHUB_ENV
          echo "UBOOTVER=$(make ubootversion)" >> $GITHUB_ENV
          echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV
          echo $BRANCH $UBOOTVER $DT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Copy files for release
        run: |
          mkdir release
          find artifacts -type f \( -name "*.bin" -o -name "*.img.gz*" -o -name "*.img" \) \
            -exec cp {} release/ \;

      - name: Generate changelog
        run: |
          echo -e "# Release\n**Commit:** ${{ github.sha }}\n**Branch:** ${{ env.BRANCH }}\n**Version:** ${{ env.UBOOTVER }}\n" > CHANGELOG.md
          echo -e "Built by workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n## Changelog\n" >> CHANGELOG.md
          git log --pretty=format:"- %h %ad **%s** %d by %an" --date=short --no-merges >> CHANGELOG.md

      - name: Create release
        if: endsWith(github.ref_name, '-bpi') || endsWith(github.ref_name, '-ci')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: CHANGELOG.md
          draft: ${{ endsWith(github.ref, '-ci') }}
          tag_name: "CI-BUILD-${{ env.BRANCH }}-${{ env.UBOOTVER }}-${{ env.DT }}"
